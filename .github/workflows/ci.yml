name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "Immutable commit to validate"
        required: true
        type: string

# Least-privilege default: every job here only reads the repo (checkout + lint/test/build),
# so contents:read is all that's needed. Publishing lives in release.yml, which escalates
# per-job where it needs id-token:write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_call' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: >-
          ruff check src tests training/reproducibility.py
          training/validate_reproducibility.py training/a17_colab.py training/tests
      - name: Type-check
        run: mypy
      - name: Public-API facade validation
        run: python scripts/check_api.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Tests (with coverage)
        if: matrix.python-version == '3.12'
        env:
          COVERAGE_CORE: sysmon
        run: pytest -n auto --dist loadgroup --cov=aegean --cov-report=term-missing
      - name: Tests
        if: matrix.python-version != '3.12'
        run: pytest -n auto --dist loadgroup

  # Targeted native Windows and macOS checks for installation, Unicode/newlines,
  # file locking, SQLite storage/recovery, and the independent-review workflow.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Platform storage, locking, Unicode, and review checks
        env:
          PYTHONUTF8: "1"
        run: >-
          pytest -rs
          tests/test_db.py
          tests/test_db_resumable_jobs.py
          tests/test_scholarly_storage_integrity.py
          tests/test_checkpoint_s14_scale_sqlite.py
          tests/test_review_roundtrip.py
          tests/test_review_dependencies.py
          tests/test_independent_review.py
          tests/test_checkpoint_s11_interchange_review.py
          tests/test_checkpoint_s12_hardening.py

  # Exercise the optional AI provider SDKs and interactive Plotly backend offline so their
  # import and adapter paths are verified in CI without external network calls.
  extras-ai-viz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,ai,viz-interactive]"
      - name: Offline AI SDK and Plotly backend tests
        run: >-
          pytest -n auto -rs
          tests/test_ai.py
          tests/test_ai_adapters.py
          tests/test_ai_endpoint_identity.py
          tests/test_ai_eval.py
          tests/test_complete_ai.py
          tests/test_fix_ai.py
          tests/test_fix_ai_cache.py
          tests/test_translation_fidelity_contract.py
          tests/test_viz.py
          tests/test_viz_new.py
          tests/test_fix_r33_viz.py

  # The [geo] extra (geopandas/shapely) is heavy, so it gets one dedicated cell instead of
  # widening the whole matrix; [parquet] rides along so the real pyarrow write path runs too.
  # Scope to all geo/parquet-exercising test modules instead of re-running the entire suite
  # (which the 6-version test matrix already covers); -rs surfaces whatever still skips.
  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,geo,parquet]"
      - name: Geo and Parquet extra tests (skips reported)
        run: >-
          pytest -n auto -rs
          tests/test_geo.py
          tests/test_gazetteer_greek.py
          tests/test_fix_dbgeo.py
          tests/test_fix_r33_geograph.py
          tests/test_fix_r33_viz.py
          tests/test_fix_wave2_promises.py
          tests/test_io.py
          tests/test_fix_io.py
          tests/test_complete_io.py
          tests/test_journey_exports.py
          tests/test_progress_followup.py
          tests/test_cli_ux_corpus.py
          tests/test_cli_doctor.py
          tests/test_checkpoint_s13_philology.py

  # The interoperability targets are large optional frameworks. Exercise their
  # real object models in one Python 3.14 cell instead of widening the five-version
  # core matrix; the ordinary matrix still runs the dependency-absent contract.
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,interop]"
      - name: Real-framework adapter tests (opt-in suite)
        run: >-
          pytest -rs -m framework_interop
          tests/test_a15_interop_spacy.py
          tests/test_a15_interop_stanza.py
          tests/test_a15_interop_cltk.py
      - name: Framework-neutral interoperability contracts
        run: >-
          pytest -rs
          tests/test_a15_interop_core.py
          tests/test_a15_interop_bundle.py
          tests/test_a15_interop_dependency_contract.py
          tests/test_cli_interop.py
          tests/test_cli_doctor.py

  neural-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,neural]"
      - name: Provision pinned model and run CPU integration tests
        env:
          PYAEGEAN_CACHE: ${{ runner.temp }}/neural-integration
        run: python scripts/check_neural_integration.py --provision

  # docs/demo/index.html installs pyaegean from PyPI with no version pin, so the published
  # page runs docs/demo/demo.py against the released wheel while every other test runs it
  # against the working tree. This cell installs that wheel into a throwaway virtual
  # environment and calls each card's default input through it. It reaches the network, so
  # it stays out of the ordinary suite behind the released_wheel marker; -s keeps the
  # version it tested against in the log.
  demo-released-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Browser demo against the released PyPI wheel (opt-in suite)
        run: pytest -rs -s -m released_wheel tests/test_demo_drift.py

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Register the python3 kernel
        run: python -m ipykernel install --user --name python3
      - name: Execute example notebooks
        run: pytest --nbmake notebooks/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Footprint guard (wheel + sdist exclude heavy binaries and training/sources)
        run: python scripts/check_footprint.py --wheel "dist/*.whl" --sdist "dist/*.tar.gz"
      - name: Candidate wheel browser-demo check
        env:
          PYAEGEAN_DEMO_WHEEL: "dist/*.whl"
        run: pytest -rs -s -m released_wheel tests/test_demo_drift.py

  footprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install .          # core only — no extras, so heavy deps stay absent
      - name: Import-clean + import-fast guard
        run: python scripts/check_footprint.py

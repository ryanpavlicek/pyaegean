name: Release

# Publishes pyaegean to (Test)PyPI via OIDC Trusted Publishing — no API tokens are
# stored anywhere. One-time setup by the repo owner on the index web UI: add a
# "pending publisher" for project "pyaegean":
#   Owner: ryanpavlicek   Repository: pyaegean   Workflow: release.yml
#   Environment name: pypi   (and a second entry with Environment: testpypi on TestPyPI)
#   PyPI:     https://pypi.org/manage/account/publishing/
#   TestPyPI: https://test.pypi.org/manage/account/publishing/
#
# Dry-run to TestPyPI:  Actions → Release → "Run workflow" → target = testpypi.
# Real release to PyPI: publish a GitHub Release tagged v0.1.0 (or Run workflow → pypi).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

# Least-privilege default for validation and build jobs.
# The testpypi/pypi jobs declare their own job-level `id-token: write` for OIDC Trusted
# Publishing; a job-level permissions block REPLACES this default, so those jobs get
# exactly id-token:write (no contents) — which is all the publish step needs.
permissions:
  contents: read

jobs:
  source:
    # Asset-hosting releases carry no package version and must not publish to either index.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          # github.sha is the release commit, or the commit of the manually selected ref.
          ref: ${{ github.sha }}
      - name: Resolve source commit
        id: source
        shell: python
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          import os
          import subprocess

          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if sha != os.environ["EXPECTED_SHA"]:
              raise SystemExit("Checked-out commit differs from the selected event commit")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha={sha}\n")

  validate:
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.source.outputs.sha }}

  build:
    needs: [source, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Footprint guard (wheel is code + JSON only, no heavy binaries)
        run: python scripts/check_footprint.py --wheel "dist/*.whl"
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
